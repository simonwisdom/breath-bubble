<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 720px; height: 450px; overflow: hidden; }
  body { font-family: -apple-system, "Helvetica Neue", sans-serif;
         background: linear-gradient(160deg, #c9dfe6 0%, #a9c7d3 50%, #8fb2c2 100%); position: relative; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 26px; background: rgba(255,255,255,0.55);
         backdrop-filter: blur(10px); font-size: 13px; display: flex; align-items: center; padding: 0 14px; gap: 18px; color: #222; }
  .bar b { font-weight: 700; }
  .bar .r { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  .icon { width: 15px; height: 15px; border-radius: 50%; border: 1.6px solid #222; display: inline-grid; place-items: center; }
  .icon::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #222; }
  .win { position: absolute; left: 40px; top: 52px; width: 470px; height: 340px; background: #fff; border-radius: 10px;
         box-shadow: 0 18px 50px rgba(20,50,70,0.3); overflow: hidden; }
  .tb { height: 30px; background: #f2f2f2; border-bottom: 1px solid #e3e3e3; display: flex; align-items: center; gap: 7px; padding-left: 12px; }
  .tb i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; }
  .tb i:nth-child(2) { background: #febc2e; } .tb i:nth-child(3) { background: #28c840; }
  .doc { padding: 22px 28px; color: #333; font-size: 14px; line-height: 1.65; }
  .doc h2 { font-size: 19px; margin: 0 0 10px; color: #111; }
  .line { height: 9px; border-radius: 5px; background: #e6eaec; margin: 11px 0; }
</style></head>
<body>
  <div class="bar"><b>Notes</b><span>File</span><span>Edit</span><span>View</span>
    <span class="r"><span class="icon"></span><span>Fri 10:42</span></span></div>
  <div class="win">
    <div class="tb"><i></i><i></i><i></i></div>
    <div class="doc">
      <h2>Quarterly plan</h2>
      <div class="line" style="width:92%"></div><div class="line" style="width:85%"></div>
      <div class="line" style="width:96%"></div><div class="line" style="width:60%"></div>
      <div class="line" style="width:0"></div>
      <div class="line" style="width:88%"></div><div class="line" style="width:94%"></div>
      <div class="line" style="width:72%"></div><div class="line" style="width:90%"></div>
      <div class="line" style="width:45%"></div>
    </div>
  </div>
</body></html>
